name: OsuDroidiOS
options:
  bundleIdPrefix: com.osudroid
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  OsuDroidiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/OsuDroid
        excludes:
          - Info.plist
    dependencies:
      - package: ZIPFoundation
    info:
      path: Sources/OsuDroid/Info.plist
      properties:
        CFBundleDisplayName: osu!droid
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osudroid.ios
        PRODUCT_NAME: OsuDroidiOS
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  OsuDroidiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/OsuDroidTests
    dependencies:
      - target: OsuDroidiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osudroid.ios.tests
schemes:
  OsuDroidiOS:
    build:
      targets:
        OsuDroidiOS: all
    test:
      targets:
        - OsuDroidiOSTests
