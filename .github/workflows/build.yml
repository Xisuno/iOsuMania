name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*' | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project OsuDroidiOS.xcodeproj \
            -scheme OsuDroidiOS \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO | tee test.log | tail -60

      - name: Build unsigned IPA (device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OsuDroidiOS.xcodeproj \
            -scheme OsuDroidiOS \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/OsuDroidiOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          mkdir -p build/ipa/Payload
          cp -R build/OsuDroidiOS.xcarchive/Products/Applications/OsuDroidiOS.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../OsuDroidiOS-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: OsuDroidiOS-unsigned-ipa
          path: build/OsuDroidiOS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test.log
